# Ubuntu nginx example — same domain for customer Next.js and Jobs API.
# Install: sudo cp docs/nginx-jobs.devminds.net.conf /etc/nginx/sites-available/jobs.devminds.net
# Then enable the site and run certbot.

upstream jobs_next {
    server 127.0.0.1:3000;
}

upstream jobs_api {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name jobs.devminds.net;

    client_max_body_size 12m;

    location /backend/ {
        proxy_pass http://jobs_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://jobs_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
